services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bob}
      POSTGRES_DB: ${POSTGRES_DB:-beautyofbharat}
    ports:
      # Bound to localhost only: the database is never exposed to the internet.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bob} -d ${POSTGRES_DB:-beautyofbharat}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Production container (VPS). Not needed for `pnpm dev`. See DEPLOY.md.
  app:
    profiles: ['app']
    build:
      context: .
      network: host
      secrets: [env]
    env_file: .env
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-bob}:${POSTGRES_PASSWORD:-bob}@postgres:5432/${POSTGRES_DB:-beautyofbharat}
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy

secrets:
  env:
    file: .env

volumes:
  pgdata:
  media:
